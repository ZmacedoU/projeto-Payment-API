spring.application.name=teste
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Stripe configuration
# IMPORTANT: Set your Stripe API key via environment variable or application-local.properties
# For local development, create src/main/resources/application-local.properties (already in .gitignore)
stripe.api.key=${STRIPE_API_KEY:YOUR_STRIPE_KEY_HERE}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:YOUR_WEBHOOK_SECRET_HERE}

# Actuator (Health Check & Monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

